<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gendargotchi">
<meta name="application-name" content="Gendargotchi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Gendargotchi</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1730;--card:#1b2547;--card2:#232f58;--ink:#f6f8ff;--muted:#a9b4d8;
    --blue:#2f5bd3;--red:#e8414f;--gold:#f3c74b;--danger:#ff5a5a;--ok:#5fe08a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
  .app{width:100%;max-width:460px;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .title{font-weight:700;font-size:20px;line-height:1.1}
  .sub{color:var(--muted);font-size:13px}
  .badge{background:var(--card);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
  .badge b{color:var(--ink);font-weight:600}

  .scene{position:relative;height:370px;border-radius:22px;overflow:hidden;background:linear-gradient(#8fcbff 0%,#cfe9ff 62%,#a9a9a9 62%,#8d8d8d 100%);transition:filter .8s}
  .scene.night{filter:brightness(.45) saturate(.8)}
  .scene.over{filter:grayscale(.85) brightness(.8)}
  .bld{position:absolute;left:0;right:0;top:0;bottom:0}
  .bld svg{width:100%;height:100%}
  .lamp{position:absolute;inset:0;background:radial-gradient(circle at 50% 75%,rgba(255,220,140,.35),transparent 60%);opacity:0;pointer-events:none}
  .night .lamp{opacity:1}
  .pet{position:absolute;left:62%;bottom:0;width:224px;height:356px;transform:translateX(-50%);cursor:pointer;transition:opacity .4s}
  .pet svg{width:100%;height:100%;overflow:visible}
  #petInner{width:100%;height:100%}
  .sprite{position:relative;width:100%;height:100%}
  .sprite img{position:absolute;left:0;right:0;bottom:6px;margin:auto;max-width:100%;max-height:calc(100% - 6px);object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
  .sprite .shadow{position:absolute;left:50%;bottom:0;width:58%;height:12px;margin-left:-29%;border-radius:50%;background:rgba(0,0,0,.22)}
  .sprite .ov{position:absolute;font-size:24px;pointer-events:none}
  .pet.away{opacity:0;pointer-events:none}
  .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .breathe{animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes breathe{50%{transform:scaleY(1.025)}}
  .wobble{animation:wobble 1.6s ease-in-out infinite;transform-origin:110px 190px}
  .wobble.fast{animation-duration:.55s}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .jump{animation:jump .45s ease-out}
  @keyframes jump{40%{transform:translateY(-22px)}}
  .bubble{position:absolute;left:10px;top:14px;background:#fff;color:#1b2547;padding:8px 14px;border-radius:16px;font-weight:500;font-size:14.5px;max-width:44%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:3}
  .bubble::after{content:"";position:absolute;right:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
  .bubble:empty{display:none}
  .car{position:absolute;bottom:20px;font-size:64px;left:50%;transform:translateX(-50%) scaleX(-1)}
  .fx{position:absolute;pointer-events:none;font-size:26px;animation:floatUp 1.4s ease-out forwards;z-index:4}
  @keyframes floatUp{to{transform:translateY(-90px) scale(1.3);opacity:0}}
  .zzz{position:absolute;left:68%;top:40px;font-size:22px;font-weight:700;color:#fff;animation:zz 2.4s ease-in infinite;opacity:0;z-index:3}
  .zzz:nth-child(2){animation-delay:.8s}.zzz:nth-child(3){animation-delay:1.6s}
  @keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(40px,-60px) scale(1.2)}}

  .card{background:var(--card);border-radius:18px;padding:12px 14px}
  .card h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
  .card h4 span{text-transform:none;letter-spacing:0;color:var(--gold)}
  .stats{display:grid;gap:7px}
  .stat{display:grid;grid-template-columns:24px 92px 1fr 30px;align-items:center;gap:6px;font-size:13.5px}
  .stat .ic{font-size:16px;text-align:center}
  .stat .v{font-size:12px;color:var(--muted);text-align:right}
  .bar{height:10px;background:#ffffff15;border-radius:999px;overflow:hidden;position:relative}
  .bar>div{height:100%;border-radius:999px;transition:width .6s}
  .bar .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
  .stat.low .lbl{color:var(--danger);font-weight:600}
  .stat.low .bar>div:first-child{background:var(--danger)!important;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.45}}

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .actions.one{grid-template-columns:1fr}
  button{font-family:inherit;border:0;cursor:pointer;color:var(--ink)}
  .act{background:var(--card);border-radius:16px;padding:10px 2px;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .1s}
  .act:active{transform:scale(.93)}
  .act .e{font-size:25px;line-height:1}
  .act[disabled]{opacity:.32}
  .act.alert{box-shadow:inset 0 0 0 2px var(--danger)}
  .big{flex-direction:row;justify-content:center;font-size:19px;padding:17px;gap:10px;background:linear-gradient(135deg,#2f5bd3,#6b3fd8)}
  .primary{background:linear-gradient(135deg,#2f5bd3,#6b3fd8);border-radius:16px;padding:14px 18px;font-size:16.5px;font-weight:600;width:100%}
  .primary.gold{background:linear-gradient(135deg,#f3c74b,#e8964b);color:#1b2547;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{transform:scale(1.02);box-shadow:0 0 22px #f3c74b88}}
  .ghost{background:#ffffff14}

  .journal{display:grid;gap:6px;font-size:13.5px;line-height:1.35}
  .journal div{display:grid;grid-template-columns:62px 1fr;gap:6px}
  .journal time{color:var(--muted);font-size:12px;padding-top:1px}
  .journal .bad{color:#ffb3b3}.journal .good{color:#b6f5c9}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#fff;color:#1b2547;padding:10px 18px;border-radius:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .3s;z-index:60;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .sheet{position:fixed;inset:0;background:rgba(5,8,20,.65);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .sheet.show{display:flex}
  .sheet .panel{background:var(--card);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:18px 16px 28px;display:grid;gap:10px;animation:up .25s ease-out;max-height:88vh;overflow:auto}
  .sheet.center{align-items:center}
  .sheet.center .panel{border-radius:24px;margin:16px;max-width:430px}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .panel h3{margin:0 0 2px;font-size:19px}
  .panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .opt{background:#ffffff10;border-radius:16px;padding:11px 14px;display:flex;align-items:center;gap:12px;font-size:15.5px;text-align:left;width:100%}
  .opt .e{font-size:28px}
  .opt small{display:block;color:var(--muted);font-size:12.5px}
  .opt.right{background:#2e8b57!important}.opt.wrong{background:#b03a48!important}
  input[type=text]{font-family:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:0;background:#ffffff18;color:var(--ink);width:100%;outline:none;text-transform:uppercase}
  .cancel{background:transparent;color:var(--muted);padding:8px;font-size:15px}
  .crit{display:grid;grid-template-columns:24px 1fr auto;gap:8px;font-size:14.5px;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff10}
  .crit span:last-child{color:var(--muted);font-size:13px}
  .tapzone{height:150px;border-radius:20px;background:linear-gradient(135deg,#e8414f,#f3964b);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
  .tapzone:active{transform:scale(.97)}
  .tri{height:6px;border-radius:3px;background:linear-gradient(90deg,#2f5bd3 33%,#fff 33% 66%,#e8414f 66%)}
  .help{color:var(--muted);font-size:12.5px;text-align:center;line-height:1.4}
  .row{display:flex;gap:8px}
  .menu{background:var(--card);border-radius:12px;width:38px;height:38px;font-size:18px;flex:none}
  /* ----- accueil ----- */
  #home{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 28%,#3550a8 0%,#1b2a66 38%,#0f1730 75%);overflow:hidden;transition:opacity .35s}
  #home.hide{opacity:0;pointer-events:none}
  #home .stars{position:absolute;inset:0;opacity:.6}
  .logo{position:relative;font-family:'Baloo 2','Fredoka',system-ui,sans-serif;font-weight:800;font-size:clamp(42px,13.5vw,66px);line-height:1;letter-spacing:-1px;text-align:center;white-space:nowrap}
  .logo span{display:inline-block;-webkit-text-stroke:5px #0c1230;paint-order:stroke fill;text-shadow:0 5px 0 #0c1230,0 8px 14px rgba(0,0,0,.45);animation:hop 2.6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(var(--r))}12%{transform:translateY(-9px) rotate(var(--r))}24%{transform:translateY(0) rotate(var(--r))}}
  .tagline{position:relative;color:#c9d4ff;font-size:14.5px;text-align:center;max-width:300px;line-height:1.4}
  .device{position:relative;width:210px;height:236px;border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;
    background:radial-gradient(circle at 35% 25%,#7fb0ff,#2f5bd3 55%,#1d3a8a);box-shadow:inset -10px -14px 0 rgba(0,0,0,.18),inset 8px 10px 0 rgba(255,255,255,.18),0 14px 30px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .device::before{content:"";position:absolute;top:18px;left:50%;width:60px;height:9px;margin-left:-30px;border-radius:5px;background:linear-gradient(90deg,#2f5bd3 33%,#fff 33% 66%,#e8414f 66%);box-shadow:0 0 0 2px #0c1230}
  .screen{width:120px;height:104px;border-radius:18px;background:#cfe3b6;box-shadow:inset 0 0 0 4px #9bb38a,0 0 0 5px #0c1230;margin-top:16px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .screen svg{width:96px;height:96px}
  .dbtns{display:flex;gap:16px}
  .dbtns i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f3c74b 60%,#c89a1e);box-shadow:0 0 0 3px #0c1230,0 3px 0 3px #0c1230}
  .dbtns i:nth-child(2){transform:translateY(6px)}
  .homebtns{position:relative;display:grid;gap:10px;width:100%;max-width:330px}
  .homebtns .primary{font-size:18px;padding:15px}
  .homebtns small{display:block;font-size:12.5px;font-weight:500;opacity:.85;margin-top:2px}
</style>
</head>
<body>
<div id="home">
  <svg class="stars" viewBox="0 0 400 800" preserveAspectRatio="none"><circle cx="0" cy="0" r="1.0" fill="#fff" opacity="0.3"/><circle cx="97" cy="173" r="1.6" fill="#fff" opacity="0.44999999999999996"/><circle cx="194" cy="346" r="2.2" fill="#fff" opacity="0.6"/><circle cx="291" cy="519" r="1.0" fill="#fff" opacity="0.75"/><circle cx="388" cy="692" r="1.6" fill="#fff" opacity="0.3"/><circle cx="85" cy="65" r="2.2" fill="#fff" opacity="0.44999999999999996"/><circle cx="182" cy="238" r="1.0" fill="#fff" opacity="0.6"/><circle cx="279" cy="411" r="1.6" fill="#fff" opacity="0.75"/><circle cx="376" cy="584" r="2.2" fill="#fff" opacity="0.3"/><circle cx="73" cy="757" r="1.0" fill="#fff" opacity="0.44999999999999996"/><circle cx="170" cy="130" r="1.6" fill="#fff" opacity="0.6"/><circle cx="267" cy="303" r="2.2" fill="#fff" opacity="0.75"/><circle cx="364" cy="476" r="1.0" fill="#fff" opacity="0.3"/><circle cx="61" cy="649" r="1.6" fill="#fff" opacity="0.44999999999999996"/><circle cx="158" cy="22" r="2.2" fill="#fff" opacity="0.6"/><circle cx="255" cy="195" r="1.0" fill="#fff" opacity="0.75"/><circle cx="352" cy="368" r="1.6" fill="#fff" opacity="0.3"/><circle cx="49" cy="541" r="2.2" fill="#fff" opacity="0.44999999999999996"/><circle cx="146" cy="714" r="1.0" fill="#fff" opacity="0.6"/><circle cx="243" cy="87" r="1.6" fill="#fff" opacity="0.75"/><circle cx="340" cy="260" r="2.2" fill="#fff" opacity="0.3"/><circle cx="37" cy="433" r="1.0" fill="#fff" opacity="0.44999999999999996"/><circle cx="134" cy="606" r="1.6" fill="#fff" opacity="0.6"/><circle cx="231" cy="779" r="2.2" fill="#fff" opacity="0.75"/><circle cx="328" cy="152" r="1.0" fill="#fff" opacity="0.3"/><circle cx="25" cy="325" r="1.6" fill="#fff" opacity="0.44999999999999996"/><circle cx="122" cy="498" r="2.2" fill="#fff" opacity="0.6"/><circle cx="219" cy="671" r="1.0" fill="#fff" opacity="0.75"/><circle cx="316" cy="44" r="1.6" fill="#fff" opacity="0.3"/><circle cx="13" cy="217" r="2.2" fill="#fff" opacity="0.44999999999999996"/><circle cx="110" cy="390" r="1.0" fill="#fff" opacity="0.6"/><circle cx="207" cy="563" r="1.6" fill="#fff" opacity="0.75"/><circle cx="304" cy="736" r="2.2" fill="#fff" opacity="0.3"/><circle cx="1" cy="109" r="1.0" fill="#fff" opacity="0.44999999999999996"/><circle cx="98" cy="282" r="1.6" fill="#fff" opacity="0.6"/><circle cx="195" cy="455" r="2.2" fill="#fff" opacity="0.75"/><circle cx="292" cy="628" r="1.0" fill="#fff" opacity="0.3"/><circle cx="389" cy="1" r="1.6" fill="#fff" opacity="0.44999999999999996"/><circle cx="86" cy="174" r="2.2" fill="#fff" opacity="0.6"/><circle cx="183" cy="347" r="1.0" fill="#fff" opacity="0.75"/></svg>

<div class="app">
  <header>
    <div style="min-width:0">
      <div class="title" id="title">Ma recrue</div>
      <div class="sub" id="subtitle">…</div>
    </div>
    <div class="row" style="align-items:center">
      <div class="badge" id="clock">—</div>
      <button class="menu" data-a="daily" id="dailyBtn" style="position:relative">📅</button><button class="menu" data-a="menu">⚙️</button>

    <div id="extras"></div>
  </div>

  <div id="cards" style="display:grid;gap:10px"></div>

<script>
(function(){
'use strict';
const KEY='ma-recrue-gend-v1', M=60000, H=3600000, D=24*H;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ======================= DONNÉES ======================= */
const QUIZ=[
 {q:"Quelle est la devise de la gendarmerie ?",a:["Pour la patrie, l'honneur et le droit","Honneur et patrie","Servir et protéger","Liberté, égalité, fraternité"],c:0},
 {q:"Quel numéro d'urgence appelle-t-on pour joindre police ou gendarmerie ?",a:["15","17","18","114"],c:1},
 {q:"Depuis 2009, la gendarmerie est rattachée au ministère…",a:["des Armées","de la Justice","de l'Intérieur","de l'Économie"],c:2},
 {q:"Qui est la sainte patronne des gendarmes ?",a:["Sainte Barbe","Sainte Geneviève","Jeanne d'Arc","Sainte Thérèse"],c:1},
 {q:"Quel est le statut des gendarmes ?",a:["Fonctionnaires civils","Militaires","Contractuels de droit privé","Agents territoriaux"],c:1},
 {q:"Quel était le nom de la gendarmerie avant 1791 ?",a:["La Garde nationale","La Maréchaussée","La Prévôté royale","Le Guet"],c:1},
 {q:"Quel grade vient juste après maréchal des logis-chef ?",a:["Major","Adjudant","Adjudant-chef","Lieutenant"],c:1},
 {q:"Que signifie OPJ ?",a:["Officier de police judiciaire","Opérateur de patrouille judiciaire","Officier de permanence de jour","Organe de poursuite judiciaire"],c:0},
 {q:"Quelle qualité judiciaire a un gendarme adjoint volontaire ?",a:["OPJ","APJ","APJA","Aucune"],c:2},
 {q:"Les infractions pénales se classent en…",a:["Fautes, délits, crimes","Contraventions, délits, crimes","Amendes, peines, crimes","Infractions légères et graves"],c:1},
 {q:"Quelle est la durée initiale d'une garde à vue de droit commun ?",a:["12 heures","24 heures","48 heures","72 heures"],c:1},
 {q:"Que signifie GIGN ?",a:["Groupe d'intervention de la gendarmerie nationale","Groupement d'investigation générale nationale","Groupe d'interpellation de la garde nationale","Garde d'intervention de la gendarmerie navale"],c:0},
 {q:"Que signifie PSIG ?",a:["Patrouille de sécurité inter-groupements","Peloton de surveillance et d'intervention de la gendarmerie","Poste de secours et d'intervention générale","Pôle de soutien à l'investigation"],c:1},
 {q:"Quelle est la mission phare de la gendarmerie mobile ?",a:["Le maintien de l'ordre","La police de la route uniquement","La garde des palais","Les enquêtes financières"],c:0},
 {q:"Quelle subdivision compte un régiment de cavalerie ?",a:["La gendarmerie départementale","La gendarmerie mobile","La Garde républicaine","La gendarmerie maritime"],c:2},
 {q:"Comment s'appelle l'unité de base de la gendarmerie mobile ?",a:["La compagnie","L'escadron","Le peloton","La brigade"],c:1},
 // --- procédure pénale ---
 {q:"Quel article du Code de procédure pénale définit le crime ou délit flagrant ?",a:["Article 16","Article 53","Article 63","Article 75"],c:1},
 {q:"Hors prolongation, combien de temps peut durer une enquête de flagrance ?",a:["48 heures","8 jours","15 jours","1 mois"],c:1},

}
let S=null, events=[];
function rnd(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
function log(s,txt,cls='',t){s.log.push({t:t||s.t,txt,c:cls});if(s.log.length>40)s.log.splice(0,s.log.length-40);}
function gradeIdx(s){return s.rank||0;}
const TITLES=['GAV','Brigadier','Brigadier-chef','Maréchal des logis'];
function sexOf(s){return s&&(s.sex||(s.kind===1?'F':'M'));}
const FW=s=>new RegExp(`(?<![\\p{L}])(?:${s})(?![\\p{L}])`,'gu');
const FEM_RULES=[
 [FW("s'il"),"si elle"],[FW('Il(?! (?:faut|fallait|faudra|y a|reste|manque|était une fois))'),'Elle'],[FW('il(?! (?:faut|fallait|faudra|y a|reste|manque))'),'elle'],

function femin(t){let x=String(t);for(const [r,v] of FEM_RULES)x=x.replace(r,v);return x;}
function T(t){return S&&S.stage!=='egg'&&sexOf(S)==='F'?femin(t):t;}
function nm(s){if(!s.name)return 'Ta recrue';if(s.stage==='autre'||(s.stage==='over'&&['boucle','condamne','range'].includes(s.end)))return 'Ex-GAV '+s.name;if(s.stage==='ecole'||s.stage==='choix')return 'Élève '+s.name;if(s.stage==='affect'||s.stage==='service'||(s.stage==='over'&&s.sub))return 'Gendarme '+s.name;return TITLES[s.rank||0]+' '+s.name;}
function chevHTML(r){
  const v=(y,c)=>`<path d="M2 ${y} l6 4.4 l6 -4.4" stroke="#0b1024" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 ${y} l6 4.4 l6 -4.4" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const B='#3d74ff',W='#ffffff';
  const inner=r===1?v(8,B)+v(13.5,B):r===2?v(3,W)+v(8.5,B)+v(14,B):r===3?v(8,W):'';
  return inner?`<svg width="17" height="22" viewBox="0 0 16 21" style="vertical-align:-4px;margin-right:6px;flex:none">${inner}</svg>`:'';
}

function endGame(s,kind){
  s.stage='over';s.end=kind;s.endedAt=s.t;s.sleeping=false;s.busyUntil=0;
  const msg={reconv:`${nm(s)} a démissionné pour une reconversion professionnelle… Il vend des cuisines équipées maintenant.`,
    disc:`Trop de retards et de manquements : le contrat de ${nm(s)} n'a pas été renouvelé.`,
    sante:`${nm(s)} a été déclaré inapte et réformé. Il fallait mieux prendre soin de sa santé.`,
    froid:`L'œuf a eu froid trop longtemps… la recrue n'est jamais arrivée.`,
    tuteur:`Tu as été un mauvais tuteur : ${nm(s)} ${rnd(s)<.5?'a démissionné':'est parti en reconversion'}. Tâche de faire mieux la prochaine fois.`,
    demission:`${nm(s)} a démissionné de l'école de sous-officiers. Il n'a pas tenu le rythme sans soutien.`,
    renvoi:`Trop de manquements : ${nm(s)} a été renvoyé de l'école de sous-officiers.`,
    radie:`Trop de manquements : ${nm(s)} a été sanctionné et a dû quitter l'institution.`,
    boucle:`🚨 ${nm(s)} est devenu le casseur le plus recherché du département… Au petit matin, ses anciens collègues frappent à la porte du squat. La boucle est bouclée.`,
    condamne:`⚖️ Casier trop chargé : ${nm(s)} a été condamné. Il aurait mieux fait d'écouter son tuteur…`,
    range:`😮‍💨 La rage est retombée : ${nm(s)} s'est rangé… il vend des cuisines équipées maintenant.`}[kind];
  log(s,msg,'bad');events.push('over');
}
/* passage d'une heure locale précise pendant [t, t+dt[ */
function crosses(t,dt,h,m){const d=new Date(t);d.setHours(h,m,0,0);const x=d.getTime();return t<x&&t+dt>=x;}
function isWeekday(t){const d=new Date(t).getDay();return d>=1&&d<=5;}
function hourOf(t){const d=new Date(t);return d.getHours()+d.getMinutes()/60;}

/* ======================= SIMULATION (pas ≤ 1 min) ======================= */
function step(s,dt){
  if(s.stage==='over'||s.stage==='choix'||s.stage==='affect') return;
  const m=dt/M,h=dt/H,t=s.t, AUT=s.stage==='autre', ECO=s.stage==='ecole', SVC=s.stage==='service', CTX=ctxOf(s), DUTY=CTX==='grDuty', MIS=SVC&&s.mission;
  if(s.stage==='egg'){
    s.warmth=clamp(s.warmth-7*m);
    if(s.warmth>=50)s.hatch+=18*m;else if(s.warmth>=20)s.hatch+=7*m;
    if(s.warmth<=0){s.coldMs+=dt;if(s.coldMs>48*H)endGame(s,'froid');}else s.coldMs=0;
    if(s.hatch>=100){s.hatch=100;s.stage='gav';s.born=t+dt;s.lastSport=t;events.push('hatch');log(s,"L'œuf a éclos : une nouvelle recrue est arrivée à la brigade ! 🎉",'good',t+dt);}
    return;
  }
  /* --- fin de manif / garde à vue (autre côté) --- */
  if(AUT&&s.gavUntil&&t+dt>=s.gavUntil){s.gavUntil=0;log(s,'🚪 Sortie de garde à vue. Le casier s\'alourdit…','',t+dt);events.push('back');}
  if(AUT&&s.busyUntil&&t+dt>=s.busyUntil){s.busyUntil=0;s.rep=clamp((s.rep||0)+8);s.motiv=clamp(s.motiv+5);s.moral=clamp(s.moral+5);
    if(Math.random()<.12*(1.15-(s.discr||0)/100))arrest(s,t+dt);else{log(s,'📢 Retour de manif : slogans, fumigènes et quelques nouveaux contacts. Réputation +8.','',t+dt);events.push('back');}
    if(s.stage!=='autre')return;}
  /* --- fin de patrouille --- */
  if(!AUT&&s.busyUntil&&t+dt>=s.busyUntil){
    const PL=(!s.patrolSet||s.patrolSet==='gav')?PATROLS:PATROL_SETS[s.patrolSet];const p=PL[s.patrolIdx%PL.length];
    s.busyUntil=0;
    const bonus=p[1]==='great'?1.6:p[1]==='mid'?0.6:1;
    if(SVC)s.exp=clamp((s.exp||0)+8*bonus);else s.comp=clamp(s.comp+8*bonus);s.disc=clamp(s.disc+5*bonus);
    if(s.moral>=40)s.motiv=clamp(s.motiv+6*bonus);
    s.moral=clamp(s.moral+(p[1]==='mid'?-3:5));
    log(s,'🚓 '+p[0],p[1]==='mid'?'':'good',s.busyUntil||t+dt);events.push('back');
  }
  const busy=s.busyUntil>t||DUTY||(AUT&&s.gavUntil>t), sl=s.sleeping;
  if(DUTY&&sl){/* il dort pendant sa faction : géré à la prise de faction */}

  /* --- besoins --- */
  s.food  =clamp(s.food  -(sl?2.5:busy?10:7)*h);
  s.energy=clamp(s.energy+(sl?(s.bedByPlayer?15:12):-(busy?9:5)-(s.lateNight?6:0))*h);
  s.moral =clamp(s.moral -(sl?0.8:s.phoneMode?1.5:DUTY?4:3)*h-(MIS&&!(t-(s._fam||0)<12*H)?1.2*h:0));
  s.tenue =clamp(s.tenue -(sl?0.5:busy?6:3)*(isRebel(s)?1.5:1)*h);
  s.forme =clamp(s.forme -0.4*h);
  s.malbouffe=Math.max(0,s.malbouffe-h/12);

  /* --- carrière --- */
  let dm=sl?-0.25:-0.6;
  if(s.moral<30)dm-=1.2;
  if(s.moral>=60&&s.forme>=60)dm+=1;
  s.motiv=clamp(s.motiv+dm*h);
  s.disc=clamp(s.disc-(isRebel(s)?0.6:0.3)*h);
  if(isRebel(s)&&!AUT)s.motiv=Math.min(s.motiv,55);
  if(AUT)s.discr=clamp((s.discr||0)+(sl?1.2:0.4)*h);

  /* --- comportements autonomes --- */
  if(!sl&&!busy){
    if(s.food<(isRebel(s)?40:15)&&t-s.lastJunk>(isRebel(s)?5:3)*H&&!DUTY){
      s.lastJunk=t;s.food=clamp(s.food+45);s.malbouffe+=1;s.forme=clamp(s.forme-6);s.moral=clamp(s.moral+4);
      const what=['un tacos XXL 🌯','une pizza 4 fromages 🍕','un kebab-frites 🥙','un menu burger double 🍔'][Math.floor(rnd(s)*4)];
      log(s,MIS?`Personne ne s'est occupé de son repas : il a vidé ${['deux rations de combat 🥫','le stock de barres de céréales de l\'escadron 🍫','un sachet de bonbons du car 🍬'][Math.floor(rnd(s)*3)]}.`:ECO?`Il a craqué au distributeur du foyer : ${['3 barres chocolatées 🍫','un paquet de chips XXL 🥔','4 canettes de soda 🥤','une pile de gaufres 🧇'][Math.floor(rnd(s)*4)]}.`:`Personne ne lui a préparé à manger : il s'est fait livrer ${what}.`,'bad');events.push('junk');
    }
    s.phoneMode=s.moral<30;
    if(s.phoneMode&&t-s.lastScroll>6*H){
      s.lastScroll=t;s.motiv=clamp(s.motiv-4);
      log(s,(ECO?['📱 Seul dans sa chambre, il se demande s\'il ne va pas démissionner de l\'école.','📱 Un copain de lycée lui vante sa vie « sans rassemblement à l\'aube ».','📱 Il a regardé comment rompre son contrat d\'élève…']:['📱 Il passe des heures sur son téléphone… et regarde des offres de reconversion.','📱 Un ancien GAV lui vante le privé : « on gagne plus et on dort la nuit ».','📱 Il a téléchargé une appli de recherche d\'emploi.'])[Math.floor(rnd(s)*3)],'bad');
    }
    if(t-s.lastSport>36*H&&t-(s._sportWarn||0)>24*H){s._sportWarn=t;log(s,"Ça fait plus d'un jour et demi qu'il n'a pas fait de sport. Il s'empâte…",'bad');}
  } else s.phoneMode=false;
  if(DUTY&&s.food<5&&t-(s._malaise||0)>6*H){s._malaise=t;s.health=clamp(s.health-12);s.disc=clamp(s.disc-4);log(s,'🥴 Malaise en faction : il n\'avait rien mangé avant de prendre son poste !','bad');events.push('sick');}

  /* --- nuit et sommeil --- */
  if(sl&&s.bedByPlayer&&isRebel(s)&&crosses(t,dt,23,30)&&rnd(s)<.6){s.sleeping=false;s.bedByPlayer=false;s.lateNight=true;log(s,'🎧 Il s\'est relevé en douce pour jouer en ligne avec ses potes.','bad');}
  else if(!sl&&!busy&&crosses(t,dt,23,30)){s.lateNight=true;log(s,'🌙 23 h 30 et il n\'est toujours pas couché : il traîne sur les jeux vidéo.','bad');}
  if(!sl&&crosses(t,dt,1,30)){s.sleeping=true;s.bedByPlayer=false;s.sleepStart=t;s.lateNight=false;log(s,'Il a fini par s\'endormir tout habillé à 1 h 30.','bad');}
  else if(!sl&&!busy&&s.energy<=0){s.sleeping=true;s.bedByPlayer=false;s.sleepStart=t;s.lateNight=false;log(s,ECO?'Épuisé, il s\'est effondré sur son lit de chambrée.':'Épuisé, il s\'est effondré sur le canapé.','bad');events.push('faint');}
  if(s.sleeping){
    const hr=hourOf(t);
    if(s.bedByPlayer&&(isWeekday(t)?crosses(t,dt,7,45):crosses(t,dt,8,45))){s.sleeping=false;s.bedByPlayer=false;log(s,`⏰ Réveil à ${isWeekday(t)?'7 h 45':'8 h 45'}, comme tu l'avais programmé.`,'good');}
    else if(s.energy>=100&&(hr>=8&&hr<22)){s.sleeping=false;s.bedByPlayer=false;events.push('wake');}
  }

  /* --- prise de service : 8 h 30 en semaine, 9 h 30 le week-end --- */
  if(!AUT&&(isWeekday(t)?crosses(t,dt,8,30):crosses(t,dt,9,30))&&!busy){
    if(s.sleeping){
      s.retards++;s.retardsSince=(s.retardsSince||0)+1;s.disc=clamp(s.disc-15);s.motiv=clamp(s.motiv-4);s.sleeping=false;s.bedByPlayer=false;s.moral=clamp(s.moral-5);
      if(SVC&&s.sub==='GR')s.disc=clamp(s.disc-5);
      log(s,SVC&&s.sub==='GR'?`😬 En retard pour la relève de la garde devant le ${s.palace} ! Faute grave pour un garde républicain (retard n° ${s.retards}).`:MIS?`😬 En retard au rassemblement de l'escadron en plein déplacement (retard n° ${s.retards}).`:ECO?`😬 En retard au rassemblement ! Le cadre de contact le note dans son carnet (retard n° ${s.retards}).`:`😬 En retard à la prise de service ! Le commandant de brigade n'est pas content (retard n° ${s.retards}).`,'bad');events.push('late');
    } else if(s.tenue<30){
      s.disc=clamp(s.disc-8);log(s,ECO?'👔 Inspection du matin : treillis froissé, rangers ternes. Corvée de quartier !':'👔 Au rassemblement, sa tenue était négligée. Remarque du chef.','bad');
    } else {
      dailyEvent(s,'ontime');s.disc=clamp(s.disc+4);log(s,SVC&&s.sub==='GR'?`✅ Prise de faction devant le ${s.palace} : tenue impeccable.`:ECO?'✅ Rassemblement : à l\'heure et impeccable, félicité devant la section.':'✅ À l\'heure et impeccable à la prise de service.','good');
    }
  }

  /* --- santé --- */
  if(s.tenue<15||s.malbouffe>=3||s.food<5)s.sickAcc+=h;else s.sickAcc=Math.max(0,s.sickAcc-h);
  if(!s.sick&&s.sickAcc>=3){s.sick=true;s.sickAcc=0;log(s,'🤒 Il est tombé malade.','bad');events.push('sick');}
  let dh=0;
  if(s.food<=0)dh-=10;
  if(s.sick)dh-=4;
  if(s.energy<=5&&!sl)dh-=3;
  if(s.malbouffe>=4)dh-=2;
  if(dh===0&&!s.sick)dh=3;
  s.health=clamp(s.health+dh*h);

  if(s.health<=0)return endGame(s,'sante');
  if(s.motiv<=0)return endGame(s,ECO?'demission':AUT?'range':'reconv');
  if(AUT){if((s.rep||0)>=100)return endGame(s,'boucle');return;}
  if(s.disc<=0)return endGame(s,ECO?'renvoi':SVC?'radie':'disc');
  if(SVC){
    if(s.sub==='GR'&&s.releveUntil&&t+dt>=s.releveUntil&&t<s.releveUntil){log(s,'⏱️ Fin de la relève : retour au poste.','',s.releveUntil);events.push('back');}
    if(DUTY&&t-(s._grLog||0)>3*H){s._grLog=t;s.exp=clamp((s.exp||0)+1);

function jump(){const p=$('pet');p.classList.remove('jump');void p.offsetWidth;p.classList.add('jump');}
function sheet(html,center){const sh=$('sheet');$('panel').innerHTML=T(html);sh.classList.toggle('center',!!center);sh.classList.add('show');}
function closeSheet(){$('sheet').classList.remove('show');}
const cool=(last,h)=>S.t-last<h*H;
function refuses(p=.75){
  if(!isRebel(S)||S.stage!=='gav'||Math.random()>=p)return false;

}

function option(o){
  const [k,v]=o.split(':');const s=S;tick();
  if(k==='close'){closeSheet();return;}
  if(k==='daily'){openDaily();return;}
  if(k==='chest'){openChest();return;}
  if(k==='qday'){openQDay();return;}
  if(k==='promote'){
    if(!s.board||s.board.until<=s.t||!promoCrit(s,s.board.k).every(x=>x[1])){closeSheet();return toast('Trop tard ou conditions non remplies.');}
    if(isRebel(s)&&Math.random()<.5){closeSheet();return refuses(1);}
    const k=s.board.k;s.rank=k;s.board=null;s.retardsSince=0;s.motiv=clamp(s.motiv+10);s.moral=clamp(s.moral+15);
    log(s,`🎖️ Promu ${GRADES[k]} par la commission d'avancement !`,'good');
    sheet(`<h3>🎖️ Félicitations !</h3><p>${esc(nm(s))} est promu <b>${GRADES[k]}</b>. Il est fier comme jamais : motivation et moral en hausse.</p><button class="primary" data-o="close">Bravo !</button>`,true);
    fx('🎖️',4);lastLook='';actKey='';save();render();return;
  }
  if(k==='reset'){return sheet(`<h3>Tout recommencer ?</h3><p>La recrue actuelle sera définitivement perdue.</p><div class="row"><button class="primary ghost" data-o="close">Non</button><button class="primary" style="background:var(--danger)" data-o="resetok">Oui</button></div>`,true);}
  if(k==='home'){closeSheet();showHome();return;}
  if(k==='resetok'){closeSheet();S=newGame();lastLook='';actKey='';log(S,'Un nouvel œuf est arrivé à la brigade.');save();render();return;}
  closeSheet();
  if(['eat:popote','eat:salade','talk:career','talk:praise','talk:recadrer','fun:famille'].includes(o)&&refuses())return;
  if(k==='eat'){
    if(s.food>=95)return toast("Il n'a plus faim !");
    if(v==='popote'||v==='salade')dailyEvent(s,'eat_healthy');
    if(v==='popote'){s.food=clamp(s.food+40);s.forme=clamp(s.forme+2);s.moral=clamp(s.moral+4);fx('🍲');}
    if(v==='salade'){s.food=clamp(s.food+22);s.forme=clamp(s.forme+5);s.moral=clamp(s.moral-4);s.malbouffe=Math.max(0,s.malbouffe-.5);fx('🥗');}
    if(v==='fast'){s.food=clamp(s.food+50);s.moral=clamp(s.moral+10);s.forme=clamp(s.forme-6);s.malbouffe+=1;fx('🍔');if(s.malbouffe>=3)toast('Attention, trop de malbouffe : il risque de tomber malade !');}
    jump();
  }
  if(k==='talk'){
    dailyEvent(s,'talk');const tired=cool(s.lastTalk,2);s.lastTalk=s.t;const f=tired?.35:1;
    if(v==='career'){
      if(s.moral<35){s.motiv=clamp(s.motiv+4*f);toast("Il n'a pas trop la tête à ça… remonte-lui le moral d'abord.");}
      else{s.motiv=clamp(s.motiv+16*f);fx('🔥',3);toast(tired?'Il connaît le discours par cœur maintenant…':'Il se voit déjà avec ses galons de gendarme ! 🔥');}
      log(s,S.stage==='ecole'?"💬 Entretien avec le cadre de contact : vous avez parlé de son affectation.":"💬 Entretien carrière : vous avez parlé de l'école de sous-officiers.");
    }
    if(v==='praise'){s.moral=clamp(s.moral+15*f);s.motiv=clamp(s.motiv+4*f);fx('👏',2);toast(tired?'Encore des compliments ? Ça perd de sa valeur…':'Il bombe le torse, tout fier 😊');}
    if(v==='recadrer'){s.disc=clamp(s.disc+15*f);s.moral=clamp(s.moral-12);toast('Message reçu, chef. 😐');log(s,'☝️ Recadrage : il a compris le message.','');}
    jump();
  }
  if(k==='fun'){
    if(s.energy<10)return toast('Il est trop fatigué.');
    if(v==='collegues'){s.moral=clamp(s.moral+22);s.motiv=clamp(s.motiv+4);s.energy=clamp(s.energy-12);s.food=clamp(s.food+10);fx('🍻',2);log(s,S.stage==='autre'?'🎉 Soirée au squat avec le groupe. Ça refait le monde jusqu\'à tard.':S.stage==='ecole'?'🍻 Soirée au foyer avec la promo. Bonne ambiance !':'🍻 Sortie avec les collègues de la brigade. Bonne ambiance !','good');}
    if(v==='console'){s.moral=clamp(s.moral+14);s.motiv=clamp(s.motiv-2);s.energy=clamp(s.energy-6);fx('🎮');}
    if(v==='famille'){
      if(cool(s._fam||0,6)){s.moral=clamp(s.moral+4);toast('Il les a déjà appelés tout à l\'heure.');}
      else{s._fam=s.t;s.moral=clamp(s.moral+10);s.motiv=clamp(s.motiv+6);fx('💙',2);toast('Sa mère est tellement fière de lui !');}
    }
    jump();
  }
  save();render();
}

function ligneGame(training){
  const s=S,DUR=10000;let p=30,t0=0,last=0,raf=0,done=false,broke=false;
  sheet(`<h3>🛡️ ${training?'Entraînement au maintien de l\'ordre':'Tenir la ligne'}</h3><p>La foule pousse ! Tape « TENIR ! » pour garder la pression sous la zone rouge pendant 10 secondes.</p>
    <div style="position:relative;height:26px;border-radius:13px;background:#ffffff14;overflow:hidden"><div style="position:absolute;right:0;top:0;bottom:0;width:15%;background:#b03a4888"></div><div id="pBar" style="height:100%;width:30%;background:linear-gradient(90deg,#4fd1c5,#f3c74b,#e8414f)"></div></div>
    <div class="row" style="justify-content:space-between;font-weight:600"><span id="pT">10 s</span><span id="pM">La ligne tient</span></div>
    <button class="tapzone" id="tap" style="height:130px;background:linear-gradient(135deg,#2f3f75,#2f5bd3)">TENIR !</button>`,true);
  function frame(ts){
    if(!t0){t0=ts;last=ts;}const dt=(ts-last)/1000;last=ts;const el=ts-t0;
    const surge=Math.sin(el/700)>0.6?22:0;p+=(14+surge+el/1000*2.2)*dt;
    const b=$('pBar');if(!b)return;b.style.width=Math.min(100,p)+'%';$('pT').textContent=Math.max(0,Math.ceil((DUR-el)/1000))+' s';
    $('pM').textContent=p>70?'⚠️ Ça pousse fort !':'La ligne tient';
    if(p>=100){broke=true;return finish();}
    if(el>=DUR)return finish();
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  $('tap').addEventListener('pointerdown',e=>{e.preventDefault();p=Math.max(0,p-7.5);});
  function finish(){
    if(done)return;done=true;cancelAnimationFrame(raf);tick();
    dailyEvent(s,'ligne');if(training){s.exp=clamp((s.exp||0)+(broke?1:4));s.forme=clamp(s.forme+4);s.energy=clamp(s.energy-12);s.tenue=clamp(s.tenue-10);}

    sheet(`<h3>${broke?'La ligne a cédé… 😬':'La ligne a tenu ! 💪'}</h3><p>${broke?'Il faudra plus de cohésion la prochaine fois.':'Bravo, l\'escadron est resté soudé.'}</p><button class="primary" data-o="close">OK</button>`,true);
    save();render();
  }
}

/* --- tir : stand de tir --- */
function tirGame(){
  const s=S,N=12;let n=0,pts=0,done=false,timer=0;
  sheet(`<h3>🎯 Stand de tir</h3><p>Tape les cibles au plus près du centre avant qu'elles disparaissent. ${N} cibles.</p>
    <div id="range" style="position:relative;height:230px;border-radius:16px;background:linear-gradient(#5b6b4a,#3f4a33);overflow:hidden;touch-action:manipulation"></div>
    <div class="row" style="justify-content:space-between;font-weight:600"><span id="tN">Cible 0/${N}</span><span id="tP">0 pt</span></div>`,true);
  const range=$('range');
  function spawn(){
    if(done)return;if(n>=N)return setTimeout(finish,600);
    n++;$('tN').textContent=`Cible ${n}/${N}`;
    const sz=64,x=Math.random()*(range.clientWidth-sz),y=Math.random()*(range.clientHeight-sz);
    const t=document.createElement('div');
    t.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:radial-gradient(circle,#e8414f 0 16%,#fff 16% 34%,#1b1b24 34% 52%,#fff 52% 70%,#1b1b24 70% 100%);box-shadow:0 2px 6px #0006;animation:pop .15s ease-out`;
    let hit=false;
    t.addEventListener('pointerdown',e=>{
      e.stopPropagation();if(hit)return;hit=true;
      const r=t.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)/(r.width/2);
      const p=d<.2?10:d<.4?7:d<.6?4:2;pts+=p;$('tP').textContent=pts+' pts';
      const f=document.createElement('div');f.textContent='+'+p;f.style.cssText=`position:absolute;left:${x+20}px;top:${y+16}px;font-weight:700;color:#ffe37a;font-size:20px;pointer-events:none`;
      range.appendChild(f);t.remove();setTimeout(()=>f.remove(),500);
    });
    range.appendChild(t);
    setTimeout(()=>{t.remove();},1150);
    timer=setTimeout(spawn,900);
  }
  setTimeout(spawn,500);
  function finish(){
    if(done)return;done=true;clearTimeout(timer);tick();
    const gain=Math.min(25,Math.round(pts/4.4));

function keyNoon(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12).getTime();}
function dayGap(a,b){return Math.round((keyNoon(b)-keyNoon(a))/D);}

function ensureDaily(s){if(!s.daily)s.daily={streak:0,best:0,lastDay:'',perm:1,permWeek:'',missions:[],mDay:'',chest:false,chests:0,qDay:'',qOk:0,medals:[],days:[]};return s.daily;}

function genMissions(s,day){
  const ids=Object.keys(DAILY_POOL).filter(k=>DAILY_POOL[k].ok(s));let seed=hashStr(day+s.gid),out=[];
  while(out.length<Math.min(3,ids.length)){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const k=ids[seed%ids.length];if(!out.includes(k))out.push(k);}
  return out.map(k=>({id:k,p:0,done:false}));
}
function dailyEvent(s,id,n=1){
  const d=s.daily;if(!d||d.mDay!==dayKey(s.t))return;
  const m=d.missions.find(x=>x.id===id&&!x.done);if(!m)return;
  m.p+=n;if(m.p>=DAILY_POOL[id].g){m.done=true;log(s,`📋 Mission du jour accomplie : ${DAILY_POOL[id].l}`,'good');events.push('dmission');}
}
/* appelée à chaque tick (jour réel) */
function checkDaily(s){
  if(!s)return false;
  const d=ensureDaily(s),today=dayKey(Date.now());let changed=false;
  // permission hebdomadaire (le lundi)
  const wk=(()=>{const x=new Date(Date.now());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return dayKey(x.getTime());})();
  if(d.permWeek!==wk){d.permWeek=wk;d.perm=1;changed=true;}
  if(d.lastDay!==today){
    if(!d.lastDay)d.streak=1;
    else{const g=dayGap(d.lastDay,today);
      if(g===1)d.streak++;
      else if(g===2&&d.perm>0){d.perm--;d.streak++;log(s,'🎟️ Une permission a protégé ta série de présence (un jour manqué).','good');}
      else if(g>1){log(s,`💔 Série de présence perdue après ${d.streak} jour(s). On repart !`,'bad');d.streak=1;}}
    d.lastDay=today;d.best=Math.max(d.best,d.streak);d.days.push(today);if(d.days.length>30)d.days.splice(0,d.days.length-30);
    if(d.streak===3){s.moral=clamp(s.moral+15);addMedal(s,'s3');}
    if(d.streak===7){s.motiv=clamp(s.motiv+10);addMedal(s,'s7');}
    if(d.streak===14){s.motiv=clamp(s.motiv+10);s.moral=clamp(s.moral+10);addMedal(s,'s14');}
    if(d.streak===30)addMedal(s,'s30');
    d.pendingPopup=s.stage!=='over';changed=true;
  }
  if(s.stage==='over')return changed;
  if(d.mDay!==today){d.mDay=today;d.missions=genMissions(s,today);d.chest=false;changed=true;}
  // missions devenues impossibles (changement de phase) : on les régénère en gardant la progression des autres
  if(d.missions.some(m=>!m.done&&!DAILY_POOL[m.id].ok(s))){const keep=d.missions.filter(m=>m.done||DAILY_POOL[m.id].ok(s));const fresh=genMissions(s,today+'b').filter(m=>!keep.some(k=>k.id===m.id));d.missions=keep.concat(fresh).slice(0,3);changed=true;}
  if(s.moral>=70)dailyEvent(s,'mood');
  return changed;
}

  if(k==='cont'){hideHome();return;}
  if(k==='back'){showHome();return;}
  if(k==='new'){if(S&&(S.stage!=='egg'||S.hatch>5||S.name)&&S.stage!=='over')return showHome(true);}
  if(k==='new'||k==='newok'){S=newGame();lastLook='';actKey='';lastBg=null;log(S,'Un œuf mystérieux a été déposé à la brigade…');save();hideHome();toast('🥚 Nouvelle partie : couve ton œuf !');}
});
function start(st){
  S=st;if(S.stage==='affect'&&S.sub){S.t=Date.now();startService(S);}if(S.stage==='ecole'&&!S.schoolStart){S.t=Date.now();startSchool(S);}lastLook='';actKey='';tick();render();
  if(S.stage==='gav'&&!S.name&&$('home').classList.contains('hide'))askName();
  if(!$('home').classList.contains('hide'))showHome();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(a&&!a.disabled){act(a.dataset.a);return;}
  const o=e.target.closest('[data-o]');if(o){option(o.dataset.o);return;}
  if(e.target.id==='sheet'&&!$('nameIn')&&!$('tap')&&!$('range'))closeSheet();
});
$('pet').addEventListener('click',()=>{
  if(!S)return;if(S.stage==='egg')return act('warm');
  if((S.stage!=='gav'&&S.stage!=='ecole'&&S.stage!=='service'&&S.stage!=='autre')||S.sleeping)return;
  if(ctxOf(S)==='grDuty'){fx('😐');return;}
  const HL=S.stage==='ecole'?HAPPY_SCHOOL:happyList(S);happyAt=Date.now();happyLine=HL[Math.floor(Math.random()*HL.length)];fx(isRebel(S)?'🫧':'🇫🇷');jump();render();
});
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)saveRemote();else render();});
window.addEventListener('pagehide',()=>{tick();saveRemote();});

showHome();
const local=loadLocal();
if(local)start(local);else $('cards').innerHTML='<div class="card sub" style="text-align:center">Chargement…</div>';
let booted=!!local;
const fb=setTimeout(()=>{if(!booted){booted=true;const n=newGame();log(n,'Un œuf mystérieux a été déposé à la brigade…');start(n);save();}},6000);
connect().then(res=>{
  const remote=res&&res.data?JSON.parse(JSON.stringify(res.data)):null;
  if(!booted){booted=true;clearTimeout(fb);let n=remote;if(!n){n=newGame();log(n,'Un œuf mystérieux a été déposé à la brigade…');}start(n);save();return;}
  if(!remote){saveRemote();return;}
  const c=pick(S,remote);
  if(c===remote){start(remote);saveLocal();}else if(JSON.stringify(S)!==JSON.stringify(remote))saveRemote();
});
setInterval(()=>{if(S){tick();render();}},1000);
})();
</script>
</body>
</html>
